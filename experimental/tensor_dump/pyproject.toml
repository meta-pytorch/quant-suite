[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Experimental: installed from a git subdirectory or in editable mode, never
# published to PyPI. See ../README.md.
[project]
name = "quant_suite_tensor_dump"
dynamic = ["version"]
description = "Records linear and attention tensors of a QuantSuite model as a QuantSuite extension"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "quant_suite_core>=0.1.0",
    "quant_suite_recipe>=0.1.0",
    "torch>=2.13",
]

[project.optional-dependencies]
# Needed only to write dumps.
vllm = [
    "quant_suite_vllm>=0.1.0",
]
test = [
    "pytest",
]

[project.entry-points."quant_suite.recipe_runtimes"]
tensor_dump = "tensor_dump.runtime:RUNTIME"

[project.urls]
Homepage = "https://github.com/meta-pytorch/quant-suite"
Repository = "https://github.com/meta-pytorch/quant-suite"
Issues = "https://github.com/meta-pytorch/quant-suite/issues"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "tensor_dump.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["tensor_dump*"]

[tool.setuptools.package-data]
tensor_dump = ["py.typed"]
