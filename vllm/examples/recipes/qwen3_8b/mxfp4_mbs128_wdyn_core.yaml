linear_recipe:
  '.*':
    activation: fake_mxfp4_mbs128
    weight:
      type: fake
      quant_config:
        elem_dtype: e2m1
        elem_round_mode: nearest
        block_size: 1x16
        scale_dtype: e8m0
        scale_norm_mode: pow2max
        scale_round_mode: oas
        global_scale_granularity: mbs128
        global_scale_dtype: e0m8
        mbs_dynamic: true
    bias: none
